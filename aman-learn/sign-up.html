<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up — aman.learn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/styles.css" />
</head>

<body data-page="sign-up">
    <main class="auth-wrap">
        <div class="auth-card">
            <a class="logo" href="index.html">
                <span class="logo-tile" data-icon="terminal"></span>
                <span class="logo-word">aman.learn</span>
            </a>

            <h1>Start learning</h1>
            <p>Create an account to save notes and track your practice</p>

            <button class="oauth" type="button">
                <span data-icon="google"></span>Continue with Google
            </button>

            <div class="divider">or</div>

            <form onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" type="text" autocomplete="name" placeholder="Your name" required />
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" autocomplete="new-password" placeholder="••••••••" required />
                </div>
                <button class="btn btn-primary btn-block" type="submit">Create account</button>
            </form>

            <p class="auth-foot">Already have an account? <a href="sign-in.html">Log in</a></p>
            <p class="auth-back"><a class="textlink" href="index.html">Back to home</a></p>
        </div>
    </main>

    <script src="assets/app.js"></script>
</body>

</html>
